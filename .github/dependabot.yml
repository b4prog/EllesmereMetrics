# Dependabot version updates: https://docs.github.com/code-security/dependabot
# The only dependencies in this repository are the GitHub Actions used by CI.
# Dependabot keeps their pinned commit SHAs and version comments current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
