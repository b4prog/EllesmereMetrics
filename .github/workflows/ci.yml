# Lints, tests and packages the addon. Every step calls a Makefile target, so
# CI runs exactly what `make all` runs locally. No WoW client is involved.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token; the workflow needs no secrets. Pull requests from forks run
# with the same restrictions (pull_request, not pull_request_target).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LUA: lua5.1
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lua5.1 lua-check zip unzip
          lua5.1 -v
          luacheck --version

      - name: Check syntax
        run: make syntax

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build the archive
        run: make pack

      - name: Verify the archive
        run: make verify

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EllesmereMetrics-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
